<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AVENTURApp</title>
<meta name="theme-color" content="#FBF3E4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AVENTURApp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF3E4; --paper:#FFFDF8; --soft:#F3E6D3; --soft2:#E9D7C0;
  --ink:#2B211B; --ink2:#6B5A4E;
  --ocre:#D9653B; --sun:#F6C445; --mint:#8CC7A1; --sky:#9CCBE8; --rose:#F2A7A0;
  --r:18px; --maxw:440px; --navh:72px;
  --fd:'Fredoka',system-ui,sans-serif; --fu:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fu);font-weight:600;-webkit-tap-highlight-color:transparent}
body{max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.1}
.screen{display:none;padding:16px 16px calc(var(--navh) + 28px + env(safe-area-inset-bottom))}
.screen.active{display:block}
.screen.sin-nav{padding-bottom:40px}
.card{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);box-shadow:3px 3px 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);font-family:var(--fd);font-weight:600;font-size:17px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.prim{background:var(--ocre);color:#fff}
.btn.sun{background:var(--sun)}
.btn.chico{min-height:40px;font-size:15px;padding:0 12px}
.btn.full{width:100%}
.muted{color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- cabecera ---------- */
.logo{display:flex;flex-direction:column;align-items:center;margin:6px 0 14px;text-align:center}
.logo small{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.18em;color:var(--ink2)}
.logo b{font-family:var(--fd);font-weight:700;font-size:34px;letter-spacing:.01em;line-height:1}
.logo b span{color:var(--ocre)}
.hola{font-size:16px;text-align:center;margin:0 0 18px}
.sec-t{font-family:var(--fd);font-weight:600;font-size:20px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}

/* ---------- tarjeta de aventura ---------- */
.av{overflow:hidden;margin-bottom:18px}
.av-ilus{background:var(--av,var(--sky));border-bottom:2px solid var(--ink);padding:10px 8px 0}
.av-b{padding:14px 16px 16px}
.av-b h2{font-size:24px}
.av-epoca{font-family:var(--fd);font-weight:600;font-size:13px;letter-spacing:.08em;color:var(--ocre);text-transform:uppercase;margin-bottom:4px}
.av-intro{margin:8px 0 12px;font-size:15px;line-height:1.4}
.av-prog{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:14px}
.sellitos{display:flex;gap:4px;flex-wrap:wrap}
.sellitos i{width:16px;height:16px;border-radius:50%;border:2px dashed var(--ink2);display:block}
.sellitos i.ok{border:2px solid var(--ink);background:var(--ocre)}
.sellitos i.ok.fz{background:var(--sun)}
.av-acc{display:flex;gap:10px}
.av-acc .btn.prim{flex:1}

/* ---------- ilustraciones ---------- */
.ilus{display:block;width:100%}
.ilus svg,.ilus img{display:block;width:100%;height:auto}
.ilus img{aspect-ratio:168/64;object-fit:contain}
.ilus.foto{padding:0!important;background:none!important}
.ilus.foto img{aspect-ratio:3/2;object-fit:cover;border-radius:10px}
.av-ilus:has(.foto){padding:0;background:none}
.av-ilus .ilus.foto img{border-radius:0}
.ilus .emo{font-size:64px;text-align:center;line-height:1.6}
/* escena compuesta con piezas del kit */
.esc{position:relative;aspect-ratio:2/1;overflow:hidden}
.esc .fondo{position:absolute;left:50%;bottom:5%;height:80%;transform:translateX(-50%);opacity:.9}
.esc .actores{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-evenly;padding:0 3% 4%}
.esc .actores img{display:block;height:var(--h,60%);max-width:44%;object-fit:contain;flex-shrink:1;min-width:0}
.esc .actores img.arriba{align-self:flex-start;margin-top:5%}
/* Chewie, el guía */
.chewie{display:flex;gap:8px;align-items:flex-start;margin:0 0 12px}
.chewie img{width:58px;height:58px;object-fit:contain;flex-shrink:0}
.chewie .bur{position:relative;flex:1;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.4}
.chewie .bur::before{content:"";position:absolute;left:-8px;top:18px;width:12px;height:12px;background:#fff;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.chewie .bur b{font-family:var(--fd);font-weight:600;color:var(--ocre)}
.sabias summary img{width:30px;height:30px;object-fit:contain}
/* quién eres */
.quien{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,180px));justify-content:center;gap:14px;margin-top:8px}
.u{padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--fd);font-weight:700;font-size:22px;background:var(--paper)}
.u img{width:100%;height:120px;object-fit:contain}
.u:active{transform:translate(3px,3px);box-shadow:none}
.yo{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 18px}
.yo img{width:46px;height:46px;object-fit:contain;border:2px solid var(--ink);border-radius:50%;background:var(--sun);padding:2px}
.yo p{margin:0;font-size:16px;text-align:left;line-height:1.3}

/* ---------- el rollo (juego) ---------- */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 16px;margin:-16px -16px 14px;background:var(--bg);border-bottom:2px solid var(--ink)}
.topbar h1{flex:1;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);border-radius:12px;background:var(--paper);flex-shrink:0}
.ico-btn svg{width:22px;height:22px}
.rollo{position:relative}
.pan{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:14px 14px 16px;transform-origin:top center}
.pan.nuevo{animation:desenrolla .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes desenrolla{from{clip-path:inset(0 0 100% 0);transform:translateY(-6px)}to{clip-path:inset(0 0 0 0);transform:none}}
.pan.fin{background:#FFF4EC}
.pan.final{background:#FFF8DF;border-color:var(--ocre);border-width:3px}
.corte{display:flex;align-items:center;gap:8px;margin:6px 0;color:var(--ink2);font-family:var(--fd);font-size:13px;font-weight:600}
.corte::before,.corte::after{content:"";flex:1;border-top:2px dashed var(--soft2)}
.corte svg{width:18px;height:18px}
.pan-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.num{width:34px;height:34px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;font-size:17px;flex-shrink:0;background:var(--paper)}
.fin .num{background:var(--ink);color:#fff}
.final .num{background:var(--ocre);color:#fff;border-color:var(--ocre)}
.pan-h h2{font-size:21px;text-transform:uppercase;letter-spacing:.01em}
.pan .ilus{margin:4px 0 10px;border-radius:10px;background:var(--soft);padding:6px 4px 0;overflow:hidden}
.pan .ilus.kit{padding:0}
.pan.fin .ilus{background:#FBE3D3}
.pan.final .ilus{background:#FCEBB3}
.txt{font-size:17px;line-height:1.45;margin:0 0 12px;font-weight:700}
.sabias{margin:0 0 12px}
.sabias summary{list-style:none;display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-weight:600;font-size:14px;color:var(--ocre);cursor:pointer;min-height:32px}
.sabias summary::-webkit-details-marker{display:none}
.sabias p{margin:4px 0 0;font-size:15px;line-height:1.4;background:var(--soft);border-radius:10px;padding:8px 10px}
.ops{display:flex;flex-direction:column;gap:10px}
.op{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px 8px 10px;border:2px solid var(--ink);border-radius:14px;background:#fff;text-align:left;font-size:16px;font-weight:700;line-height:1.25;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.op:active{transform:translate(3px,3px);box-shadow:none}
.op .l{width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:700;flex-shrink:0}
.op.elegida{background:var(--sun);box-shadow:none;transform:translate(3px,3px)}
.op.descartada{opacity:.35;box-shadow:none;border-style:dashed}
.op[disabled]{cursor:default}
.dato{border:2px dashed var(--ocre);border-radius:12px;padding:10px 12px;margin:0 0 14px;font-size:15px;line-height:1.4;background:#fff}
.dato b{color:var(--ocre);font-family:var(--fd);font-weight:600}
.sonido{margin-left:auto;font-family:var(--fd);font-weight:700;font-size:24px;color:var(--ocre);transform:rotate(-8deg);white-space:nowrap;pointer-events:none}
.pan.nuevo .sonido{animation:pop .5s .5s both}
@keyframes pop{from{transform:scale(0) rotate(-30deg);opacity:0}70%{transform:scale(1.25) rotate(-6deg)}to{transform:scale(1) rotate(-8deg);opacity:1}}
.sello{display:inline-block;font-family:var(--fd);font-weight:700;font-size:26px;color:var(--ocre);border:3px solid var(--ocre);border-radius:10px;padding:0 14px;transform:rotate(-6deg);margin:0 0 12px}
.pan.nuevo .sello{animation:sello .45s .3s both}
@keyframes sello{from{transform:scale(2.4) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-6deg);opacity:1}}
.final .sello{color:#fff;background:var(--ocre);font-size:20px}
.nuevo-final{display:flex;align-items:center;gap:8px;background:var(--sun);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin:0 0 12px;font-family:var(--fd);font-weight:600;font-size:15px}
.fin-acc{display:flex;flex-direction:column;gap:10px}

/* ---------- confeti ---------- */
.confeti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confeti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- álbum de finales ---------- */
.contador{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:14px}
.contador b{font-family:var(--fd);font-size:38px;font-weight:700;line-height:1}
.contador b small{font-size:20px;color:var(--ink2)}
.contador p{margin:0;font-size:14px;line-height:1.35}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fz-card{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:160px}
.fz-card .ilus{background:#FBE3D3;border-radius:10px;padding:4px 2px 0;overflow:hidden}
.fz-card .ilus.kit,.av-ilus .ilus.kit{padding:0}
.fz-card.feliz .ilus{background:#FCEBB3}
.fz-card h3{font-size:16px;text-transform:uppercase}
.fz-card .tag{align-self:flex-start;font-family:var(--fd);font-weight:600;font-size:12px;border-radius:8px;padding:2px 8px;background:var(--ink);color:#fff}
.fz-card.feliz .tag{background:var(--ocre)}
.fz-card .veces{font-size:13px;color:var(--ink2)}
.fz-card.oculto{border-style:dashed;box-shadow:none;background:transparent;align-items:center;justify-content:center;text-align:center;color:var(--ink2)}
.fz-card.oculto .q{font-family:var(--fd);font-weight:700;font-size:44px;line-height:1;color:var(--soft2)}

/* ---------- cuaderno de datos ---------- */
.dt{display:flex;gap:12px;align-items:flex-start;padding:12px;margin-bottom:10px}
.dt .num{width:30px;height:30px;font-size:15px}
.dt h3{font-size:15px;text-transform:uppercase;margin-bottom:3px}
.dt p{margin:0;font-size:15px;line-height:1.4}
.dt.oculto{border-style:dashed;box-shadow:none;background:transparent;color:var(--ink2)}

/* ---------- mapa ---------- */
.mapa-w{padding:10px 6px}
.mapa-w svg{display:block;width:100%;height:auto}
.leyenda{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;font-size:13px;margin-top:10px}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.leyenda i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}

/* ---------- pie / nav ---------- */
.pie{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:var(--ink2)}
.pie .fila{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:var(--maxw);height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--paper);border-top:2px solid var(--ink);display:flex;z-index:20}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--fd);font-weight:600;font-size:13px;color:var(--ink2)}
nav button svg{width:26px;height:26px}
nav button.on{color:var(--ink)}
nav button.on svg .rel{fill:var(--sun)}
nav.oculta{display:none}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 18px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.vacio{text-align:center;padding:30px 10px;color:var(--ink2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main>
  <section class="screen sin-nav" id="s-quien"></section>
  <section class="screen" id="s-inicio"></section>
  <section class="screen sin-nav" id="s-juego"></section>
  <section class="screen" id="s-finales"></section>
  <section class="screen" id="s-datos"></section>
  <section class="screen sin-nav" id="s-mapa"></section>
</main>

  <button data-s="inicio" class="on"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path class="rel" d="M13 6 L16 13 L13 20 L10 13 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="13" cy="13" r="1.4" fill="currentColor"/></svg>Aventuras</button>

<script>
/* ============================================================
   ESCOGE TU PROPIA AVENTURApp
   index.html único · vanilla JS · Apps Script + Sheet · PWA
   ============================================================ */
const APP_VERSION = '0.3.0';
/* Pega aquí la URL /exec del Apps Script. Vacío = modo local con la aventura de ejemplo. */
const BACKEND_URL = '';

const LS = { datos:'avp_datos_v3', partidas:'avp_partidas_v1', cola:'avp_cola_v1', juegos:'avp_juegos_v2', user:'avp_user' };
const INK = '#2B211B', OC = '#D9653B';

/* ---------- utilidades ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function leer(k, def){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
function guardar(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('on'), 2400); }
function truthy(v){ return v === true || /^(true|si|sí|1|x|verdadero)$/i.test(String(v == null ? '' : v).trim()); }

/* ============================================================
   DIBUJOS — SVG simples. Se sustituyen solos si subes
   img/escenas/<aventura>_<num>.webp
   ============================================================ */

/* ============================================================
   KIT — piezas sueltas del UI kit. Una escena se COMPONE con:
   fondo + protagonista (con su expresión) + elementos.
     img/kit/<kit>/fondos|animales|clan|objetos/<nombre>.webp   (por época)
     img/kit/<kit>/<usuario>/<expresion>.webp                   (la prota)
     img/kit/comun/chewie|fx/<nombre>.webp                      (sirve en todas)
   Si una pieza no existe, simplemente no se pinta.
   ============================================================ */
const KIT_IDX = {
  animales: 'mamut reno bisonte oso lobo jabali ciervo liebre ave pez leon',
  clan: 'papa mama hermano abuela abuelo',
  objetos: 'lanza propulsor cuchillo hueso rama antorcha bolsa carne bayas plantas silex piel trampa fuego refugio cueva huellas piedras nieve',
  fx: 'estrella exclamacion interrogacion musica zzz lineas nube copo gotas flecha piedritas hierba huella corazon garabato'
};
const KIT_DIR = {};
Object.keys(KIT_IDX).forEach(d => KIT_IDX[d].split(' ').forEach(n => { if(!KIT_DIR[n]) KIT_DIR[n] = d; }));
const KIT_COMUN = ['chewie', 'fx', 'finales'];
const KIT_ALTO = { animales:.62, clan:.74, objetos:.34, fx:.24, prota:.68,
  mamut:.88, bisonte:.6, oso:.62, lobo:.5, jabali:.44, liebre:.4, ave:.3, pez:.26, hermano:.6, abuela:.62, fuego:.4, refugio:.5, cueva:.5 };
const norm = s => String(s == null ? '' : s).trim().toLowerCase();
function kitSrc(kit, nombre){
  let n = norm(nombre), d;
  if(n.indexOf('/') > 0){ d = n.split('/')[0]; n = n.split('/')[1]; } else d = KIT_DIR[n] || 'objetos';
  return { src: KIT_COMUN.indexOf(d) >= 0 ? `img/kit/comun/${d}/${n}.webp` : `img/kit/${kit}/${d}/${n}.webp`, dir:d, n:n };
}
const chewieSrc = (pose) => `img/kit/comun/chewie/${pose}.webp`;
function kitImg(src, alto, cls){
  return `<img class="kit-img ${cls || ''}" src="${esc(src)}" alt="" style="--h:${Math.round(alto * 100)}%">`;
}
/** Escena compuesta. o = {fondo, prota, elementos} */
function componer(kit, o){
  let act = '';
  if(o.prota) act += kitImg(`img/kit/${kit}/${norm(state.user || 'gina')}/${norm(o.prota)}.webp`, KIT_ALTO.prota);
  String(o.elementos || '').split(',').map(norm).filter(Boolean).forEach(el => {
    const k = kitSrc(kit, el);
    act += kitImg(k.src, KIT_ALTO[k.n] || KIT_ALTO[k.dir] || .5, k.dir === 'fx' ? 'arriba' : '');
  });
  const fondo = o.fondo ? `<img class="kit-img fondo" src="img/kit/${kit}/fondos/${norm(o.fondo)}.webp" alt="">` : '';
  return `<div class="esc">${fondo}<div class="actores">${act}</div></div>`;
}
const tieneKit = (o) => !!(o && (o.fondo || o.prota || o.elementos));
const kitDe = (aid) => norm((aventura(aid) || {}).kit) || 'paleolitico';

/* Prioridad: imagen propia (columna imagen) → escena compuesta → dibujo SVG → emoji. */
const FALTAN = new Set(), PLAN_B = [];
function planDe(kit, o){
  if(tieneKit(o)) return { html: componer(kit, o), kit: true };
  const s = svgDibujo(o.dibujo);
  return { html: s || `<div class="emo">${esc(o.emoji || '✨')}</div>`, kit: false };
}
/* Las imágenes de escena son de la jugadora BASE (Gina). Si otra jugadora tiene su propia
   versión en img/escenas/<usuario>/<fichero>, se usa esa; si no, la de Gina. */
const USUARIO_BASE = () => norm(state.config.usuario_base) || 'gina';
function ilus(kit, o, carpeta){
  const plan = planDe(kit, o);
  const f = String(o.imagen || '').trim();
  const base = f ? `img/${carpeta}/${f}` : '';
  if(!base || FALTAN.has(base)) return `<div class="ilus ${plan.kit ? 'kit' : ''}">${plan.html}</div>`;
  const propia = (carpeta === 'escenas' && state.user && state.user !== USUARIO_BASE()) ? `img/${carpeta}/${state.user}/${f}` : '';
  const src = propia && !FALTAN.has(propia) ? propia : base;
  const i = PLAN_B.push(plan) - 1;
  return `<div class="ilus foto" data-pb="${i}" ${src !== base ? `data-base="${esc(base)}"` : ''}><img src="${esc(src)}" alt="" class="ilus-img"></div>`;
}
document.addEventListener('error', function(e){
  const im = e.target;
  if(!im || !im.classList) return;
  if(im.classList.contains('kit-img')){ im.remove(); return; }
  if(!im.classList.contains('ilus-img')) return;
  FALTAN.add(im.getAttribute('src'));
  const box = im.parentNode;
  if(box.dataset.base && !FALTAN.has(box.dataset.base)){ im.src = box.dataset.base; delete box.dataset.base; return; }
  const plan = PLAN_B[box.dataset.pb] || { html:'', kit:false };
  box.classList.remove('foto'); box.classList.toggle('kit', plan.kit); box.innerHTML = plan.html;
}, true);
const ilusEscena = (aid, e) => ilus(kitDe(aid), e, 'escenas');
const ilusAventura = (a) => ilus(norm(a.kit) || 'paleolitico', a, 'aventuras');

const state = {
  config: {}, aventuras: [], escenas: {},   // escenas[aid][num] = escena
  partidas: leer(LS.partidas, []),          // [{id, ts, aventura_id, recorrido:'1-2-5', final}]
  juegosTodos: leer(LS.juegos, {}),        // por usuario y aventura: {gina:{paleolitico:{camino:[1,2], elecciones:['a']}}}
  usuarios: [], user: leer(LS.user, ''),
  juegoAid: null, mapaAid: null, mapaVolver: 'inicio', screen: 'inicio', ultimoNuevo: 0
};

function normaliza(data){
  const d = data || {};
  const cfg = {};
  if(Array.isArray(d.config)) d.config.forEach(r => { if(r && r.clave) cfg[r.clave] = r.valor; });
  else Object.assign(cfg, d.config || {});
  state.config = cfg;
  state.usuarios = (d.usuarios || []).filter(u => u && u.username && (u.activo === undefined || u.activo === '' || truthy(u.activo)))
    .map(u => Object.assign({}, u, { username:norm(u.username) }));
  state.aventuras = (d.aventuras || [])
    .filter(a => a && a.id && (a.activa === undefined || a.activa === '' || truthy(a.activa)))
    .map(a => Object.assign({}, a, { id:String(a.id).trim() }))
    .sort((a, b) => (Number(a.orden) || 99) - (Number(b.orden) || 99));
  state.escenas = {};
  (d.escenas || []).forEach(e => {
    if(!e || !e.aventura_id || !e.num) return;
    const aid = String(e.aventura_id).trim(), n = Number(e.num);
    (state.escenas[aid] = state.escenas[aid] || {})[n] = Object.assign({}, e, {
      num:n, tipo:String(e.tipo || 'decision').trim().toLowerCase(),
      destino_a:Number(e.destino_a) || 0, destino_b:Number(e.destino_b) || 0
    });
  });
}
const aventura = (aid) => state.aventuras.find(a => a.id === aid);
function J(){ const u = state.user || '_'; return state.juegosTodos[u] = state.juegosTodos[u] || {}; }
const guardarJuegos = () => guardar(LS.juegos, state.juegosTodos);
const yo = () => state.usuarios.find(u => u.username === state.user) || { username:state.user, nombre:state.user };
const escenasDe = (aid) => state.escenas[aid] || {};
const esFinal = (e) => e && (e.tipo === 'fin' || e.tipo === 'final');
function finalesDe(aid){ return Object.values(escenasDe(aid)).filter(esFinal).sort((a, b) => a.num - b.num); }
function partidasDe(aid){ return state.partidas.filter(p => p.aventura_id === aid && norm(p.jugadora) === state.user); }
function descubiertos(aid){ const m = {}; partidasDe(aid).forEach(p => { m[p.final] = (m[p.final] || 0) + 1; }); return m; }
function visitadas(aid){
  const s = new Set();
  partidasDe(aid).forEach(p => String(p.recorrido || '').split('-').forEach(n => n && s.add(Number(n))));
  const j = J()[aid]; if(j) j.camino.forEach(n => s.add(n));
  return s;
}
function inicio(aid){ const e = escenasDe(aid); return e[1] ? 1 : Math.min.apply(null, Object.keys(e).map(Number)); }

function goScreen(s){
  state.screen = s;
  $$('.screen').forEach(el => el.classList.toggle('active', el.id === 's-' + s));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.s === s));
  $('#nav').classList.toggle('oculta', s === 'juego' || s === 'mapa' || s === 'quien');
  if(s === 'quien') renderQuien();
  if(s === 'inicio') renderInicio();
  if(s === 'finales') renderFinales();
  if(s === 'datos') renderDatos();
  if(s === 'mapa') renderMapa();
  window.scrollTo(0, 0);
}

/* ============================================================
   JUEGO — el rollo de papel
   ============================================================ */
function abrirJuego(aid){
  const j = J()[aid];
  const ult = j && escenasDe(aid)[j.camino[j.camino.length - 1]];
  if(!j || esFinal(ult)) nuevoJuego(aid, false);
  state.juegoAid = aid; state.ultimoNuevo = 0;
  goScreen('juego'); renderJuego();
}
function nuevoJuego(aid, pintar){
  J()[aid] = { camino:[inicio(aid)], elecciones:[] };
  guardarJuegos();
  if(pintar){ state.ultimoNuevo = 0; renderJuego(); window.scrollTo(0, 0); }
}
function renderJuego(){
  const aid = state.juegoAid, a = aventura(aid), j = J()[aid], E = escenasDe(aid);
  if(!a || !j){ goScreen('inicio'); return; }
  let h = `<div class="topbar"><button class="ico-btn" data-acc="salir" aria-label="Volver">${icoAtras}</button>
    <h1>${esc(a.titulo)}</h1><button class="ico-btn" data-acc="mapa" aria-label="Mapa">${icoMapa}</button></div><div class="rollo">`;
  j.camino.forEach((num, i) => {
    const e = E[num], ult = i === j.camino.length - 1;
    if(i > 0) h += `<div class="corte">${icoTijera}desenrolla</div>`;
    if(!e){ h += `<article class="pan"><p class="txt">Esta parte de la historia todavía no existe (escena ${num}).</p>
      <button class="btn full" data-acc="deshacer">↩ Volver atrás</button></article>`; return; }
    h += panel(aid, e, ult ? null : j.elecciones[i], ult, ult && num === state.ultimoNuevo);
  });
  h += `</div>`;
  $('#s-juego').innerHTML = h;
}
function panel(aid, e, elegida, activa, nuevo){
  const fin = esFinal(e), feliz = e.tipo === 'final';
  let h = `<article class="pan ${fin ? (feliz ? 'final' : 'fin') : ''} ${nuevo ? 'nuevo' : ''}">
    <div class="pan-h"><span class="num">${e.num}</span><h2>${esc(e.titulo)}</h2>${e.sonido ? `<span class="sonido" aria-hidden="true">${esc(e.sonido)}</span>` : ''}</div>
    ${ilusEscena(aid, e)}
    <p class="txt">${esc(e.texto)}</p>`;
  if(!fin){
    if(e.dato) h += `<details class="sabias"><summary><img src="${chewieSrc('oliendo')}" alt="" class="kit-img">Chewie sabe algo…</summary>
      <div class="chewie" style="margin-top:6px"><img src="${chewieSrc('explorando')}" alt="" class="kit-img"><div class="bur"><b>¿Sabías que…?</b> ${esc(e.dato)}</div></div></details>`;
    h += `<div class="ops">` + ['a', 'b'].filter(k => e['opcion_' + k]).map(k => {
      const cls = elegida ? (elegida === k ? 'elegida' : 'descartada') : '';
      return `<button class="op ${cls}" ${activa ? `data-op="${k}"` : 'disabled'}><span class="l">${k.toUpperCase()}</span><span>${esc(e['opcion_' + k])}</span></button>`;
    }).join('') + `</div>`;
    if(activa && J()[aid].camino.length > 1) h += `<div style="margin-top:12px;text-align:center"><button class="btn chico" data-acc="deshacer">↩ Me arrepiento</button></div>`;
  } else {
    const desc = descubiertos(aid), fins = finalesDe(aid);
    h += `<div class="sello">${feliz ? '¡FINAL FELIZ!' : 'FIN'}</div>`;
    if(nuevo && desc[e.num] === 1) h += `<div class="nuevo-final">⭐ ¡Final nuevo! Llevas ${fins.filter(f => desc[f.num]).length} de ${fins.length}</div>`;
    if(e.dato) h += `<div class="chewie"><img src="${chewieSrc(feliz ? 'comiendo' : 'sentado')}" alt="" class="kit-img">
      <div class="bur"><b>${feliz ? '¡Lo logramos!' : '¡Ánimo! Prueba otro camino.'}</b><br><b>Dato real:</b> ${esc(e.dato)}</div></div>`;
    if(activa) h += `<div class="fin-acc">
      ${feliz ? '' : `<button class="btn sun full" data-acc="deshacer">↩ Volver a la última decisión</button>`}
      <button class="btn prim full" data-acc="otra">Empezar de nuevo</button>
      <button class="btn full" data-acc="mapa">Ver mi camino en el mapa</button></div>`;
  }
  return h + `</article>`;
}
$('#s-juego').addEventListener('click', e => {
  const op = e.target.closest('[data-op]'); if(op) return elegir(op.dataset.op);
  const a = e.target.closest('[data-acc]'); if(!a) return;
  const acc = a.dataset.acc, aid = state.juegoAid;
  if(acc === 'salir') goScreen('inicio');
  if(acc === 'mapa') abrirMapa(aid, 'juego');
  if(acc === 'otra') nuevoJuego(aid, true);
  if(acc === 'deshacer') deshacer();
});
function elegir(k){
  const aid = state.juegoAid, j = J()[aid], E = escenasDe(aid);
  const e = E[j.camino[j.camino.length - 1]], dest = e && e['destino_' + k];
  if(!dest) return;
  j.elecciones.push(k); j.camino.push(dest);
  state.ultimoNuevo = dest;
  const sig = E[dest];
  if(esFinal(sig)) registrarPartida(aid, j.camino.slice(), dest);
  guardarJuegos();
  renderJuego();
  const pans = $$('#s-juego .pan'); const ult = pans[pans.length - 1];
  if(ult) setTimeout(() => ult.scrollIntoView({ behavior:'smooth', block:'start' }), 60);
  if(esFinal(sig)){
    try { navigator.vibrate && navigator.vibrate(sig.tipo === 'final' ? [60, 60, 60] : 120); } catch(err){}
    if(sig.tipo === 'final') confeti();
  }
}
function deshacer(){
  const j = J()[state.juegoAid];
  if(!j || j.camino.length < 2) return;
  j.camino.pop(); j.elecciones.pop();
  guardarJuegos();
  state.ultimoNuevo = 0; renderJuego();
  const pans = $$('#s-juego .pan'); const ult = pans[pans.length - 1];
  if(ult) ult.scrollIntoView({ block:'start' });
}
function confeti(){
  const c = document.createElement('div'); c.className = 'confeti';
  const cols = ['#D9653B', '#F6C445', '#8CC7A1', '#9CCBE8', '#F2A7A0'];
  for(let i = 0; i < 40; i++){
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
    p.style.animationDelay = (Math.random() * .5) + 's';
    c.appendChild(p);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 3600);
}

function renderFinales(){
  let h = `<h1 style="font-size:28px;margin:6px 0 4px">Álbum de finales</h1><p class="muted" style="margin:0 0 16px">¿Los encontrarás todos? Algunos son desastres muy graciosos.</p>`;
  state.aventuras.forEach(a => {
    const fins = finalesDe(a.id), desc = descubiertos(a.id), n = fins.filter(f => desc[f.num]).length;
    h += `<div class="card contador"><b>${n}<small>/${fins.length}</small></b><p><strong>${esc(a.titulo)}</strong><br>${n === fins.length ? '¡Los tienes todos! Eres una experta.' : 'Te faltan ' + (fins.length - n) + '. Prueba caminos distintos.'}</p></div><div class="grid2">`;
    fins.forEach(f => {
      const veces = desc[f.num];
      if(!veces) h += `<div class="card fz-card oculto"><div class="q">?</div><div style="font-family:var(--fd);font-weight:600">${f.tipo === 'final' ? 'Final feliz secreto' : 'Final secreto'}</div></div>`;
      else h += `<div class="card fz-card ${f.tipo === 'final' ? 'feliz' : ''}">${ilusEscena(a.id, f)}
        <h3>${esc(f.titulo)}</h3><span class="tag">${f.tipo === 'final' ? 'FINAL FELIZ' : 'FIN'}</span>
        <span class="veces">${veces === 1 ? 'Lo encontraste 1 vez' : 'Lo encontraste ' + veces + ' veces'}</span></div>`;
    });
    h += `</div>`;
  });
  $('#s-finales').innerHTML = h;
}

/* ============================================================
   CUADERNO DE DATOS
   ============================================================ */
function renderDatos(){
  let h = `<h1 style="font-size:28px;margin:6px 0 4px">Cuaderno de datos</h1><p class="muted" style="margin:0 0 16px">Cada escena que visitas te regala un dato real de la historia.</p>`;
  state.aventuras.forEach(a => {
    const vis = visitadas(a.id);
    const conDato = Object.values(escenasDe(a.id)).filter(e => e.dato).sort((x, y) => x.num - y.num);
    const n = conDato.filter(e => vis.has(e.num)).length;
    h += `<div class="card contador"><b>${n}<small>/${conDato.length}</small></b><p><strong>${esc(a.titulo)}</strong><br>${n === conDato.length ? '¡Cuaderno completo!' : 'Datos descubiertos'}</p></div>`;
    conDato.forEach(e => {
      if(vis.has(e.num)) h += `<div class="card dt"><span class="num">${e.num}</span><div><h3>${esc(e.titulo)}</h3><p>${esc(e.dato)}</p></div></div>`;
      else h += `<div class="card dt oculto"><span class="num">?</span><div><h3>Dato escondido</h3><p>Sigue explorando para descubrirlo.</p></div></div>`;
    });
  });
  $('#s-datos').innerHTML = h;
}

/* ============================================================
   MAPA DEL CAMINO — árbol de escenas, sin destripar lo no visto
   ============================================================ */
function abrirMapa(aid, volver){ state.mapaAid = aid; state.mapaVolver = volver || 'inicio'; goScreen('mapa'); }
function niveles(E){
  const lvl = {}, q = [inicio(state.mapaAid)]; lvl[q[0]] = 0;
  while(q.length){
    const n = q.shift(), e = E[n]; if(!e) continue;
    [e.destino_a, e.destino_b].forEach(d => { if(d && E[d] && lvl[d] === undefined){ lvl[d] = lvl[n] + 1; q.push(d); } });
  }
  const max = Math.max.apply(null, Object.values(lvl).concat([0]));
  Object.keys(E).forEach(n => { if(lvl[n] === undefined) lvl[n] = max + 1; });
  return lvl;
}
function renderMapa(){
  const aid = state.mapaAid, a = aventura(aid), E = escenasDe(aid);
  if(!a){ goScreen('inicio'); return; }
  const vis = visitadas(aid), lvl = niveles(E);
  const filas = {};
  Object.keys(E).map(Number).sort((x, y) => x - y).forEach(n => { (filas[lvl[n]] = filas[lvl[n]] || []).push(n); });
  const W = 340, RH = 74, R = 17, pos = {};
  const nf = Object.keys(filas).length;
  Object.keys(filas).forEach(l => { const f = filas[l]; f.forEach((n, i) => { pos[n] = { x: (i + 1) * W / (f.length + 1), y: 34 + Number(l) * RH }; }); });
  const H = 34 + (nf - 1) * RH + 34;
  /* El camino a resaltar: la partida en curso o la última terminada. */
  const j = J()[aid];
  let camino = j ? j.camino : [];
  if(camino.length < 2){ const ps = partidasDe(aid); if(ps.length) camino = String(ps[ps.length - 1].recorrido).split('-').map(Number); }
  const enCamino = new Set(); for(let i = 1; i < camino.length; i++) enCamino.add(camino[i - 1] + '>' + camino[i]);
  let lines = '', nodes = '';
  Object.keys(E).map(Number).forEach(n => {
    if(!vis.has(n)) return;
    const e = E[n];
    [e.destino_a, e.destino_b].forEach(d => {
      if(!d || !pos[d]) return;
      const p1 = pos[n], p2 = pos[d], on = enCamino.has(n + '>' + d);
      const my = (p1.y + p2.y) / 2;
      lines += `<path d="M${p1.x} ${p1.y + R} C${p1.x} ${my + 10} ${p2.x} ${my - 10} ${p2.x} ${p2.y - R}" fill="none" stroke="${on ? OC : '#B5A89E'}" stroke-width="${on ? 4 : 2}" ${on ? '' : 'stroke-dasharray="4 5"'} stroke-linecap="round"/>`;
    });
  });
  Object.keys(E).map(Number).forEach(n => {
    const p = pos[n], e = E[n], v = vis.has(n);
    if(!v){ nodes += `<g><circle cx="${p.x}" cy="${p.y}" r="${R}" fill="${'#FBF3E4'}" stroke="#B5A89E" stroke-width="2" stroke-dasharray="4 4"/><text x="${p.x}" y="${p.y + 6}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="17" fill="#B5A89E">?</text></g>`; return; }
    const fill = e.tipo === 'final' ? '#F6C445' : e.tipo === 'fin' ? INK : '#FFFDF8';
    const col = e.tipo === 'fin' ? '#fff' : INK;
    const ring = camino[camino.length - 1] === n ? `<circle cx="${p.x}" cy="${p.y}" r="${R + 5}" fill="none" stroke="${OC}" stroke-width="2.5"/>` : '';
    nodes += `<g>${ring}<circle cx="${p.x}" cy="${p.y}" r="${R}" fill="${fill}" stroke="${INK}" stroke-width="2.2"/><text x="${p.x}" y="${p.y + 6}" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="16" fill="${col}">${n}</text></g>`;
  });
  const total = Object.keys(E).length;
  $('#s-mapa').innerHTML = `<div class="topbar"><button class="ico-btn" data-acc="volver" aria-label="Volver">${icoAtras}</button><h1>Mapa · ${esc(a.titulo)}</h1><span style="width:44px"></span></div>
    <p class="muted" style="margin:0 0 12px;text-align:center">Has visitado ${vis.size} de ${total} escenas. Las <b>?</b> son caminos por descubrir.</p>
    <div class="card mapa-w"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de escenas">${lines}${nodes}</svg></div>
    <div class="leyenda"><span><i style="background:#FFFDF8"></i>Escena</span><span><i style="background:${INK}"></i>Fin</span><span><i style="background:#F6C445"></i>Final feliz</span><span><i style="border-style:dashed;border-color:#B5A89E"></i>Sin descubrir</span><span><i style="border-color:${OC};background:${OC}"></i>Tu camino</span></div>`;
}
$('#s-mapa').addEventListener('click', e => {
  if(e.target.closest('[data-acc="volver"]')){
    if(state.mapaVolver === 'juego'){ goScreen('juego'); renderJuego(); } else goScreen(state.mapaVolver);
  }
});

/* ============================================================
   PROGRESO + BACKEND (Apps Script por GET, como el resto de apps)
   ============================================================ */
function registrarPartida(aid, camino, final){
  const p = { id:uid(), ts:new Date().toISOString(), aventura_id:aid, recorrido:camino.join('-'), final:final, jugadora:state.user };
  state.partidas.push(p); guardar(LS.partidas, state.partidas);
  const cola = leer(LS.cola, []); cola.push({ action:'savePartida', payload:p }); guardar(LS.cola, cola);
  flush();
}
async function api(action, params){
  const q = new URLSearchParams({ action:action });
  Object.keys(params || {}).forEach(k => q.set(k, typeof params[k] === 'string' ? params[k] : JSON.stringify(params[k])));
  const r = await fetch(BACKEND_URL + '?' + q.toString(), { redirect:'follow' });
  const t = await r.text();
  let j; try { j = JSON.parse(t); } catch(e){ throw new Error('El servidor no respondió bien (¿falta redesplegar el Apps Script?)'); }
  if(!j.ok) throw new Error(j.error || 'Error del servidor');
  return j.data;
}
let flushing = false;
async function flush(){
  if(!BACKEND_URL || flushing) return;
  flushing = true;
  try {
    let cola = leer(LS.cola, []);
    while(cola.length){
      await api(cola[0].action, { payload:cola[0].payload });
      cola.shift(); guardar(LS.cola, cola);
    }
  } catch(e){ /* sin red: se reintenta en el próximo arranque */ }
  flushing = false;
}
async function borrarProgreso(){
  state.partidas = state.partidas.filter(p => norm(p.jugadora) !== state.user); state.juegosTodos[state.user] = {};
  guardar(LS.partidas, state.partidas); guardarJuegos();
  if(BACKEND_URL){ try { await api('borrarPartidas', { confirmar:'si', jugadora:state.user }); } catch(e){ toast('Borrado en este móvil. El Sheet no respondió.'); } }
  toast('Progreso borrado. ¡A empezar de cero!');
  renderInicio();
}
function forzarActualizacion(){
  const fin = () => location.replace(location.pathname + '?_t=' + Date.now());
  Promise.resolve()
    .then(() => navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))) : null)
    .then(() => window.caches ? caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))) : null)
    .then(() => { try { localStorage.removeItem(LS.datos); } catch(e){} })
    .catch(() => {}).then(fin);
}
function arrancarPantalla(){
  if(!state.user || !state.usuarios.some(u => u.username === state.user)) goScreen('quien');
  else goScreen('inicio');
}
function repintar(){
  if(state.screen === 'inicio') renderInicio();
  if(state.screen === 'finales') renderFinales();
  if(state.screen === 'datos') renderDatos();
}
async function bootstrap(){
  normaliza(leer(LS.datos, null) || SEED);
  if(!state.usuarios.length) state.usuarios = SEED.usuarios.slice();
  arrancarPantalla();
  if(!BACKEND_URL) return;
  try {
    const d = await api('getBootstrap', {});
    if(d && d.aventuras && d.aventuras.length){ guardar(LS.datos, d); normaliza(d); }
    /* Partidas: unión por id (lo del Sheet + lo local que aún no subió). */
    if(d && Array.isArray(d.partidas)){
      const ids = new Set(state.partidas.map(p => p.id));
      d.partidas.forEach(p => { if(p && p.id && !ids.has(p.id)) state.partidas.push(Object.assign({}, p, { final:Number(p.final) })); });
      guardar(LS.partidas, state.partidas);
    }
    if(!state.usuarios.length) state.usuarios = SEED.usuarios.slice();
    if(state.screen === 'quien') renderQuien();
    else if(state.screen !== 'juego' && state.screen !== 'mapa') repintar();
    flush();
  } catch(e){ /* sin red: seguimos con lo guardado */ }
}

if('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js', { updateViaCache:'none' }).catch(() => {});
}
bootstrap();
</script>
